<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11181a" />
    <title>FOIL</title>
    <meta name="description" content="Turn any picture into a collectible card and give it a rare finish — foil, holographic, polychrome, gold, prism and more. Save it as a PNG or a looping clip." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 14'%3E%3Crect width='10' height='14' rx='1.5' fill='%23161c1f'/%3E%3Crect x='1' y='1' width='8' height='12' rx='1' fill='%23f3eee2'/%3E%3Crect x='2' y='2' width='6' height='7' fill='%23ff5a4f'/%3E%3Crect x='2' y='5' width='6' height='4' fill='%231a9cff'/%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FOIL" />
    <meta property="og:title" content="FOIL — turn any picture into a rare foil card" />
    <meta property="og:description" content="Give any picture a rare finish — foil, holographic, polychrome, gold, prism and more. Free, right in your browser. Save it as a PNG or a looping clip." />
    <meta property="og:url" content="https://dennougorilla.github.io/foil/" />
    <meta property="og:image" content="https://dennougorilla.github.io/foil/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A pixel-art card with a holographic finish beside a fanned hand of foil finishes, under the FOIL logo." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FOIL — turn any picture into a rare foil card" />
    <meta name="twitter:description" content="Give any picture a rare finish — foil, holographic, polychrome, gold, prism and more. Free, right in your browser." />
    <meta name="twitter:image" content="https://dennougorilla.github.io/foil/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>

    <div class="app">
      <header class="top">
        <h1 class="logo">
          <button class="logo-word" id="logoBtn" type="button">
            <span class="tile" aria-hidden="true">F</span><span class="tile" aria-hidden="true">O</span><span class="tile" aria-hidden="true">I</span><span class="tile" aria-hidden="true">L</span>
            <i class="spark" aria-hidden="true"></i><i class="spark" aria-hidden="true"></i><i class="spark" aria-hidden="true"></i><i class="spark" aria-hidden="true"></i>
          </button>
        </h1>
        <div class="toggles">
          <button class="chip chip-binder" id="binderBtn" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1h10v14H3zm2 2v10h6V3zM1 3h2v2H1zm0 4h2v2H1zm0 4h2v2H1z" /></svg>
            <span class="binder-name" data-t="binder"></span><b class="binder-count">0</b>
          </button>
          <a class="chip chip-icon" id="repoLink" href="https://github.com/dennougorilla/foil" target="_blank" rel="noopener">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.71 1.23 1.87.87 2.33.67.07-.52.28-.87.5-1.07-1.78-.2-3.65-.89-3.65-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.66 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 8 0z" /></svg>
          </a>
          <div class="support">
            <button class="chip chip-heart" id="supportBtn" type="button" aria-expanded="false" aria-controls="supportMenu">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h3v1h1v1h2V3h1V2h3v1h1v5h-1v1h-1v1h-1v1h-1v1H9v1H7v-1H6v-1H5v-1H4V9H3V8H2V3h1z" /></svg>
              <span data-t="support"></span>
            </button>
            <div class="support-menu" id="supportMenu" hidden>
              <p class="support-title" data-t="supportTitle"></p>
              <a class="support-link" href="https://github.com/sponsors/dennougorilla" target="_blank" rel="noopener">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.71 1.23 1.87.87 2.33.67.07-.52.28-.87.5-1.07-1.78-.2-3.65-.89-3.65-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.66 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 8 0z" /></svg>
                <span><b>GitHub Sponsors</b><small data-t="supportGh"></small></span>
              </a>
              <a class="support-link" href="https://buymeacoffee.com/dennougorip" target="_blank" rel="noopener">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5h10v1h2v4h-2v2h-1v1H4v-1H3v-1H2zm10 2v2h1V7zM4 1h1v2H4zm3 0h1v2H7zm3 0h1v2h-1z" /></svg>
                <span><b>Buy Me a Coffee</b><small data-t="supportBmc"></small></span>
              </a>
              <div class="support-foot">
                <p class="app-credit"><span data-t="creditPre"></span><a id="creditLink" href="https://www.playbalatro.com/" target="_blank" rel="noopener">Balatro</a><span data-t="creditPost"></span></p>
                <p class="app-version"><a id="versionLink" href="https://github.com/dennougorilla/foil/releases" target="_blank" rel="noopener"></a></p>
              </div>
            </div>
          </div>
          <button class="chip" id="langBtn" type="button"></button>
          <button class="chip" id="soundBtn" type="button" aria-pressed="true">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" /><path class="wave" d="M11 5.5c1 .8 1 4.2 0 5M12.5 4c2 1.6 2 6.4 0 8" /></svg>
            <span data-t="sound"></span>
          </button>
          <button class="chip" id="crtBtn" type="button" aria-pressed="true">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="3" width="13" height="9" rx="2" /><path d="M5 14h6" /></svg>
            <span data-t="crt"></span>
          </button>
        </div>
      </header>

      <main class="stage" id="stage">
        <canvas id="cards" aria-hidden="true"></canvas>
        <div class="showcase">
          <button class="card-slot" id="cardSlot" type="button"></button>
          <button class="btn btn-paper stage-pick" id="pickBtnStage" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 11V2M4.5 5.5 8 2l3.5 3.5M2 10v3.5h12V10" /></svg>
            <span class="btn-text"><b data-t="pick"></b></span>
          </button>
          <aside class="info" id="info">
            <div class="info-box">
              <input class="info-name" id="nameInput" type="text" maxlength="24" autocomplete="off" spellcheck="false" />
              <input class="info-type" id="typeInput" type="text" autocomplete="off" spellcheck="false" hidden />
              <div class="info-desc">
                <textarea class="is-hint" id="messageInput" rows="2" spellcheck="false"></textarea>
              </div>
              <div class="pills">
                <span class="pill pill-rarity" id="pillRarity">
                  <span class="rarity-pick" id="raritySeg" role="radiogroup"></span>
                  <span id="rarityName"></span>
                </span>
                <span class="pill" id="pillEdition"></span>
              </div>
            </div>
            <p class="card-hint" data-t="cardHint"></p>
          </aside>
        </div>
        <div class="hand-wrap">
          <div class="hand-row">
            <div class="hand" id="hand" role="radiogroup">
              <p class="hand-peek" id="handPeek" aria-hidden="true" hidden></p>
            </div>
            <div class="deck-dock" id="deckDock"></div>
          </div>
          <div class="hand-bar">
            <button class="chip chip-icon hand-step" id="handPrev" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2h2v2H9zM7 4h2v2H7zM5 6h2v4H5zm2 4h2v2H7zm2 2h2v2H9z" /></svg></button>
            <p class="hand-caption" id="handCaption" aria-hidden="true"><i data-t="finishLabel"></i><b></b><span></span></p>
            <button class="chip chip-icon hand-step" id="handNext" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 2h2v2H5zm2 2h2v2H7zm2 2h2v4H9zm-2 4h2v2H7zm-2 2h2v2H5z" /></svg></button>
          </div>
        </div>
      </main>

      <aside class="panel" id="panel">
        <section class="sec sec-image" aria-labelledby="imageTitle">
          <button class="recap" id="recapImage" type="button">
            <i class="step" aria-hidden="true">1</i>
            <span class="recap-thumb" id="recapThumb" aria-hidden="true"></span>
            <b class="recap-name" id="recapImageName"></b>
            <span class="recap-go" data-t="recapGo"></span>
          </button>
          <div class="sec-head">
            <h2 class="sec-title"><i class="step" aria-hidden="true">1</i><span id="imageTitle" data-t="secImage"></span></h2>
            <small class="sec-note" id="thumbLabel"></small>
          </div>
          <div class="thumbs" id="thumbs" role="radiogroup"></div>
          <button class="btn pick" id="pickBtn" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 11V2M4.5 5.5 8 2l3.5 3.5M2 10v3.5h12V10" /></svg>
            <span class="btn-text"><b data-t="pickFile"></b><small data-t="pickSub"></small></span>
          </button>
          <div class="image-error" id="imageError" hidden>
            <p role="alert"></p>
            <div class="image-error-actions">
              <button class="btn btn-paper" id="imageErrorPick" type="button">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 11V2M4.5 5.5 8 2l3.5 3.5M2 10v3.5h12V10" /></svg>
                <span class="btn-text"><b data-t="pickAnother"></b></span>
              </button>
              <button class="link" id="imageErrorClose" type="button" data-t="close"></button>
            </div>
          </div>
          <input type="file" id="fileInput" accept="image/png,image/apng,.apng,image/jpeg,image/webp,image/gif,image/avif,image/bmp" hidden />
          <div class="crop" id="crop">
            <div class="crop-view" id="cropView" tabindex="0" role="application">
              <canvas id="cropCanvas"></canvas>
              <div class="crop-window" id="cropWindow"></div>
            </div>
            <div class="crop-side">
              <div class="row">
                <label class="field-label" for="zoom" data-t="zoom"></label>
                <output id="zoomOut" for="zoom"></output>
                <input type="range" id="zoom" min="1" max="4" step="0.01" value="1" />
              </div>
              <p class="hint" data-t="cropTip"></p>
              <button class="link crop-reset" id="cropReset" type="button" data-t="cropReset"></button>
            </div>
          </div>
        </section>

        <section class="sec sec-finish" aria-labelledby="finishTitle">
          <button class="recap" id="recapFinish" type="button">
            <i class="step" aria-hidden="true">2</i>
            <span class="finish-proof recap-thumb" id="recapProof" aria-hidden="true"></span>
            <b class="recap-name" id="recapFinishName"></b>
            <span class="recap-go" data-t="recapGo"></span>
          </button>
          <h2 class="sec-title"><i class="step" aria-hidden="true">2</i><span id="finishTitle" data-t="secFinish"></span></h2>
          <div class="finish-row">
            <span class="finish-proof" id="finishProof" aria-hidden="true"></span>
            <b class="finish-name" id="finishName"></b>
            <small class="finish-look" id="finishLook"></small>
            <button class="finish-pick" id="finishPick" type="button">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 5h4v8H1zm4-2h4v1H6v9H4V4h1zm5-1h4v8h-4zM9 3h1v9H9z" /></svg>
              <span data-t="finishPick"></span>
            </button>
          </div>
          <div class="flip-row" id="flipRow" hidden>
            <span class="flip-thumb" id="flipThumb" aria-hidden="true"></span>
            <span class="flip-text"><b data-t="flipLabel"></b><small><span id="flipNow"></span> <button class="link" id="flipClear" type="button" data-t="flipClear"></button></small></span>
            <button class="finish-pick" id="flipPick" type="button" data-t="flipPick"></button>
            <input type="file" id="flipInput" accept="image/png,image/apng,.apng,image/jpeg,image/webp,image/gif,image/avif,image/bmp" hidden />
          </div>
        </section>

        <section class="sec sec-adjust" id="adjust">
          <button class="adjust-toggle" id="adjustToggle" type="button" aria-controls="adjustBody" aria-expanded="false">
            <svg class="adjust-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h7v2H2zm10 0h2v2h-2zM9 2h3v4H9zM2 11h2v2H2zm5 0h7v2H7zM4 10h3v4H4zM2 7h4v2H2zm7 0h5v2H9zM6 6h3v4H6z" /></svg>
            <span class="adjust-text"><b data-t="adjust"></b><small id="adjustSummary"></small></span>
            <span class="adjust-close" data-t="adjustClose"></span>
            <svg class="adjust-chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5h2v2h2v2h2V7h2V5h2v2h-2v2H9v2H7V9H5V7H3z" /></svg>
          </button>
          <div class="adjust-body" id="adjustBody" hidden>
            <div class="tabs-bar">
              <div class="tabs" id="panelTabs" role="tablist"></div>
            </div>
            <div class="pane" id="pane-card" role="tabpanel">
              <div class="pane-tools" id="cardTools" hidden><button class="link" id="cardReset" type="button" data-t="cardReset"></button></div>
              <div class="row">
                <label class="field-label" for="intensity" data-t="intensity"></label>
                <output id="intensityOut" for="intensity"></output>
                <input type="range" id="intensity" min="0" max="1" step="0.01" />
              </div>
              <div class="field">
                <span class="field-label" id="frameLabel" data-t="frame"></span>
                <div class="seg seg-frames" id="frameSeg" role="radiogroup" aria-labelledby="frameLabel"></div>
              </div>
              <div class="field">
                <span class="field-label" id="shapeLabel" data-t="shape"></span>
                <div class="seg seg-shapes" id="shapeSeg" role="radiogroup" aria-labelledby="shapeLabel"></div>
              </div>
              <div class="field">
                <span class="field-label" id="layoutLabel" data-t="layoutLabel"></span>
                <div class="seg seg-layouts" id="layoutSeg" role="radiogroup" aria-labelledby="layoutLabel"></div>
              </div>
              <div class="row">
                <label class="field-label" for="pixel" data-t="pixel"></label>
                <output id="pixelOut" for="pixel"></output>
                <input type="range" id="pixel" min="0" max="6" step="1" />
              </div>
            </div>
            <div class="pane" id="pane-light" role="tabpanel" hidden></div>
            <div class="pane" id="pane-text" role="tabpanel" hidden></div>
            <div class="pane" id="pane-range" role="tabpanel" hidden></div>
          </div>
        </section>

        <section class="sec sec-format">
          <div class="save-opts" id="saveOpts">
            <button class="save-opts-toggle" id="saveOptsToggle" type="button" aria-controls="saveOptsBody" aria-expanded="false">
              <span data-t="gifOpts"></span><small id="saveOptsSummary"></small>
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5h2v2h2v2h2V7h2V5h2v2h-2v2H9v2H7V9H5V7H3z" /></svg>
            </button>
            <div class="save-opts-body" id="saveOptsBody" hidden>
              <div class="field">
                <span class="field-label" id="exportMotionLabel" data-t="exportMotion"></span>
                <div class="seg seg-three" id="exportMotionSeg" role="radiogroup" aria-labelledby="exportMotionLabel"></div>
                <p class="hint save-note" id="exportMotionHelp"></p>
              </div>
              <div class="field" id="gifBgField">
                <span class="field-label" id="gifBgLabel" data-t="gifBg"></span>
                <div class="seg seg-two" id="gifBgSeg" role="radiogroup" aria-labelledby="gifBgLabel"></div>
              </div>
              <div class="field" id="matteField">
                <span class="field-label" id="matteLabel" data-t="matte"></span>
                <div class="matte" id="matteSeg" role="radiogroup" aria-labelledby="matteLabel"></div>
                <input class="matte-picker" id="mattePicker" type="color" tabindex="-1" aria-hidden="true" />
              </div>
              <p class="hint save-note" id="gifClearNote"><span data-t="gifClearNote"></span> <button class="link" id="toApng" type="button" data-t="toApng"></button></p>
            </div>
          </div>
        </section>

        <section class="sec sec-export" aria-labelledby="exportTitle">
          <div class="sec-head export-head">
            <h2 class="sec-title"><i class="step" aria-hidden="true">3</i><span id="exportTitle" data-t="secExport"></span></h2>
            <div class="export-more">
              <button class="mini-slab mini-keep" id="keepBtn" type="button">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path class="i-keep" d="M3 1h10v14H3zm2 2v10h6V3zm1 2h4v1H6zm0 2h4v1H6z" /><path class="i-kept" d="M13 3h2v2h-2zm-2 2h2v2h-2zM9 7h2v2H9zM7 9h2v2H7zM5 11h2v2H5zM3 9h2v2H3zM1 7h2v2H1z" /></svg>
                <span></span>
              </button>
              <button class="mini-slab mini-share" id="shareBtn" type="button" hidden>
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 1h2v1h1v1h1v2H9v5H7V5H5V3h1V2h1zM2 8h3v2H4v3h8v-3h-1V8h3v7H2z" /></svg>
                <span></span>
              </button>
            </div>
          </div>
          <div class="seg seg-format" id="formatSeg" role="radiogroup" aria-labelledby="exportTitle"></div>
          <button class="btn btn-primary" id="saveBtn" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v9M4.5 7.5 8 11l3.5-3.5M2 10v3.5h12V10" /></svg>
            <span class="btn-text"><b></b><small></small></span>
            <span class="save-meta"><b></b><small></small></span>
            <span class="seal" id="seal" aria-hidden="true"></span>
          </button>
        </section>
      </aside>
    </div>

    <div class="crt" id="crt" aria-hidden="true"></div>
    <div class="drop" id="drop" hidden>
      <div class="drop-box">
        <b data-t="dropHere"></b>
        <span data-t="dropSub"></span>
      </div>
    </div>
    <div class="toasts" id="toasts"></div>
    <p class="sr-only" id="announcer" aria-live="polite"></p>
    <div class="fatal" id="fatal" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
